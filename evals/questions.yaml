# Fintech questions for the LLM-as-judge harness.
# `python evals/run_evals.py` scores a live run. It does not invent results.

- id: pa-guidelines-upi
  domain: regulatory
  question: >-
    What are RBI's latest guidelines for payment aggregators, and how do they
    affect UPI-first companies?
  keywords:
    - payment aggregator
    - escrow
    - UPI
    - authorisation
    - compliance

- id: digital-lending
  domain: regulatory
  question: >-
    What does the RBI digital lending guideline require of lending service
    providers and regulated entities?
  keywords:
    - digital lending
    - lending service provider
    - key fact statement
    - cooling-off
    - direct disbursal

- id: ppi-master-direction
  domain: regulatory
  question: What are the current RBI master direction requirements for prepaid payment instruments?
  keywords:
    - prepaid payment instrument
    - PPI
    - KYC
    - full-KYC
    - outstanding balance

- id: card-tokenisation
  domain: regulatory
  question: >-
    How do RBI card-on-file tokenisation rules work, and what must merchants
    and payment aggregators do?
  keywords:
    - tokenisation
    - card-on-file
    - token requestor
    - guest checkout
    - merchant

- id: pa-cross-border
